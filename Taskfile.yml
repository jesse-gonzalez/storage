version: '3'

vars:
  IMAGE_NAME: mlpstorage
  IMAGE_TAG: '{{default "latest" .IMAGE_TAG}}'
  REGISTRY: '{{default "" .REGISTRY}}'
  FULL_IMAGE_NAME: '{{if .REGISTRY}}{{.REGISTRY}}/{{end}}{{.IMAGE_NAME}}:{{.IMAGE_TAG}}'

tasks:
  build:
    desc: Build the MLPerf Storage Docker image
    sources:
      - Dockerfile
      - pyproject.toml
      - mlpstorage/**/*.py
    generates:
      - .docker-build-{{.IMAGE_TAG}}
    method: timestamp
    cmds:
      - docker build -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} --load .
      - echo "Built image {{.IMAGE_NAME}}:{{.IMAGE_TAG}}"
      - touch .docker-build-{{.IMAGE_TAG}}

  tag:
    desc: Tag the Docker image (requires REGISTRY and optionally IMAGE_TAG)
    cmds:
      - |
        if [ -z "{{.REGISTRY}}" ]; then
          echo "Error: REGISTRY variable is required for tagging"
          echo "Usage: task tag REGISTRY=your-registry.com [IMAGE_TAG=tag]"
          exit 1
        fi
      - docker tag {{.IMAGE_NAME}}:{{.IMAGE_TAG}} {{.FULL_IMAGE_NAME}}
      - echo "Tagged image as {{.FULL_IMAGE_NAME}}"

  push:
    desc: Push the Docker image to registry (requires REGISTRY and optionally IMAGE_TAG)
    deps: [tag]
    cmds:
      - |
        if [ -z "{{.REGISTRY}}" ]; then
          echo "Error: REGISTRY variable is required for pushing"
          echo "Usage: task push REGISTRY=your-registry.com [IMAGE_TAG=tag]"
          exit 1
        fi
      - docker push {{.FULL_IMAGE_NAME}}
      - echo "Pushed image {{.FULL_IMAGE_NAME}}"

  run:
    desc: Run the MLPerf Storage container interactively
    cmds:
      - |
        docker run -it --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/data:/workspace/data \
          -v $(pwd)/results:/workspace/results \
          --user $(id -u):$(id -g) \
          --network host \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} /bin/bash

  run-cmd:
    desc: "Run a specific command in the container (usage: task run-cmd CMD=\"mlpstorage --help\")"
    cmds:
      - |
        if [ -z "{{.CMD}}" ]; then
          echo "Error: CMD variable is required"
          echo "Usage: task run-cmd CMD='mlpstorage --help'"
          exit 1
        fi
        docker run --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/data:/workspace/data \
          -v $(pwd)/results:/workspace/results \
          --user $(id -u):$(id -g) \
          --network host \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} {{.CMD}}

  compose-build:
    desc: Build using docker-compose
    cmds:
      - docker-compose build
      - echo "Built using docker-compose"

  compose-run:
    desc: Run interactively using docker-compose
    cmds:
      - docker-compose run --rm mlpstorage

  compose-up:
    desc: Start services using docker-compose in detached mode
    cmds:
      - docker-compose up -d

  compose-down:
    desc: Stop and remove containers using docker-compose
    cmds:
      - docker-compose down

  clean:
    desc: Remove the Docker image and clean up
    cmds:
      - docker rmi {{.IMAGE_NAME}}:{{.IMAGE_TAG}} 2>/dev/null || true
      - |
        if [ -n "{{.REGISTRY}}" ]; then
          docker rmi {{.FULL_IMAGE_NAME}} 2>/dev/null || true
        fi
      - rm -f .docker-build-*
      - docker system prune -f
      - echo "Cleaned up Docker images and system"

  build-and-run:
    desc: Build and run the container in one step
    deps: [build]
    cmds:
      - task: run

  build-and-push:
    desc: Build, tag, and push to registry (requires REGISTRY)
    deps: [build]
    cmds:
      - task: push
        vars:
          REGISTRY: '{{.REGISTRY}}'
          IMAGE_TAG: '{{.IMAGE_TAG}}'

  dev-test:
    desc: Run the complete developer test workflow (minimal footprint ~7GB, ~3 min)
    deps: [build]
    cmds:
      - echo "=== MLPerf Storage Developer Test ==="
      - "echo 'Model: ResNet-50 | Files: 50 | Size: ~7GB | Time: ~3 min'"
      - task: dev-datagen
      - task: dev-run  
      - task: dev-report
      - echo "=== Test Complete ==="
      - 'echo "Results: $(pwd)/results | Data: $(du -sh data/resnet50_dev 2>/dev/null | cut -f1 || echo \"Not found\")"'

  dev-datagen:
    desc: Generate minimal development dataset (ResNet-50, 50 files, ~7GB)
    deps: [build]
    cmds:
      - echo "Generating minimal dataset (50 files, ~7GB)..."
      - mkdir -p data results
      - |
        docker run --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/data:/workspace/data \
          -v $(pwd)/results:/workspace/results \
          --user $(id -u):$(id -g) --network host \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          mlpstorage training datagen \
            --hosts 127.0.0.1 \
            --model resnet50 \
            --num-processes 1 \
            --data-dir /workspace/data/resnet50_dev \
            --results-dir /workspace/results \
            --param dataset.num_files_train=50 \
            --open

  dev-run:
    desc: Run minimal development benchmark (requires dev-datagen first)
    deps: [build]
    cmds:
      - echo "Running benchmark (1 accelerator, 4GB memory)..."
      - |
        docker run --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/data:/workspace/data \
          -v $(pwd)/results:/workspace/results \
          --user $(id -u):$(id -g) --network host \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          mlpstorage training run \
            --hosts 127.0.0.1 \
            --num-client-hosts 1 \
            --client-host-memory-in-gb 4 \
            --num-accelerators 1 \
            --accelerator-type h100 \
            --model resnet50 \
            --data-dir /workspace/data/resnet50_dev \
            --results-dir /workspace/results \
            --param dataset.num_files_train=50 \
            --open

  dev-report:
    desc: Generate development benchmark report
    deps: [build]
    cmds:
      - echo "Generating report..."
      - |
        docker run --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/results:/workspace/results \
          --user $(id -u):$(id -g) --network host \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          mlpstorage reports reportgen \
            --results-dir /workspace/results

  dev-datasize:
    desc: Calculate minimum dataset size for development configuration
    deps: [build]
    cmds:
      - echo "Calculating dataset size for development config..."
      - |
        docker run --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/results:/workspace/results \
          --user $(id -u):$(id -g) --network host \
          {{.IMAGE_NAME}}:{{.IMAGE_TAG}} \
          mlpstorage training datasize \
            -m resnet50 \
            --client-host-memory-in-gb 4 \
            --num-client-hosts 1 \
            --max-accelerators 1 \
            --accelerator-type h100 \
            --results-dir /workspace/results \
            --open

  dev-clean:
    desc: Clean up generated development data and results
    cmds:
      - echo "Cleaning up development data..."
      - |
        if [ -d "data/resnet50_dev" ]; then
          echo "Removing data/resnet50_dev ($(du -sh data/resnet50_dev 2>/dev/null | cut -f1 || echo '?'))"
          rm -rf data/resnet50_dev
        fi
      - |
        if [ -d "results" ]; then
          echo "Removing results directory ($(du -sh results 2>/dev/null | cut -f1 || echo '?'))"
          rm -rf results
        fi
      - echo "Cleanup complete"

  help:
    silent: true
    desc: Show available tasks and usage examples
    cmds:
      - echo "Available tasks:"
      - task --list
      - echo ""
      - echo "Usage examples:"
      - echo ""
      - echo "Developer Testing:"
      - "echo '  task dev-test                                 # Complete workflow (~7GB, 3 min)'"
      - "echo '  task dev-datagen                              # Generate minimal dataset only'"
      - "echo '  task dev-run                                  # Run benchmark only'"
      - "echo '  task dev-report                               # Generate report only'"
      - "echo '  task dev-datasize                             # Calculate dataset size'"
      - "echo '  task dev-clean                                # Clean up generated data'"
      - echo ""
      - echo "Docker Operations:"
      - "echo '  task build                                    # Build with default tag'"
      - "echo '  task run                                      # Run interactively'"
      - "echo '  task run-cmd CMD=\"mlpstorage --version\"       # Run specific command'"
      - echo ""
      - echo "Registry Operations:"
      - "echo '  task tag REGISTRY=docker.io/user             # Tag for registry'"
      - "echo '  task push REGISTRY=ghcr.io/org               # Push to registry'"
      - "echo '  task build-and-push REGISTRY=registry.com    # Build and push'"

  default:
    desc: Show help by default
    cmds:
      - task: help